name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MOONBIT_VERSION: "0.1.20260529"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install.ps1 | pwsh -Command -

      - name: moon check
        run: moon check --target native

  test:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install.ps1 | pwsh -Command -

      - name: Setup MSVC
        run: |
          echo "LIB=C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.44.35207\lib\x64;C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\ucrt\x64;C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\um\x64" >> $env:GITHUB_ENV
          echo "INCLUDE=C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\14.44.35207\include;C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\ucrt;C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\um;C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\shared" >> $env:GITHUB_ENV

      - name: moon test
        run: moon test
