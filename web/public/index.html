<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LTMA Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid #0f3460; }
header h1 { font-size: 18px; color: #e94560; }
#chat { flex: 1; overflow-y: auto; padding: 16px 24px; }
.msg { margin: 8px 0; padding: 12px 16px; border-radius: 8px; max-width: 80%; }
.user { background: #0f3460; margin-left: auto; }
.agent { background: #16213e; }
#input-bar { display: flex; padding: 16px 24px; background: #16213e; gap: 8px; }
#input { flex: 1; padding: 10px 16px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 14px; }
#send { padding: 10px 24px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
#send:hover { background: #c73652; }
</style>
</head>
<body>
<header><h1>LTMA Chat</h1></header>
<div id="chat"></div>
<div id="input-bar">
  <input id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()">
  <button id="send" onclick="send()">Send</button>
</div>
<script>
async function send() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMsg('user', msg);
  const res = await fetch('/chat', { method:'POST', body: JSON.stringify({message:msg, agent:'chat'}) });
  const data = await res.json();
  addMsg('agent', data.response || data.error || 'no response');
}
function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  document.getElementById('chat').appendChild(div);
  div.scrollIntoView();
}
</script>
</body>
</html>
