<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTMA Chat</title>
<!-- marked: Markdown renderer -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- highlight.js: code syntax highlighting -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-highlight/lib/index.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
header { padding: 16px 24px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 18px; color: #e94560; }
header span { font-size: 12px; color: #888; }
#chat { flex: 1; overflow-y: auto; padding: 16px 24px; }
.msg { margin: 12px 0; padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.6; }
.msg.user { background: #0f3460; margin-left: auto; }
.msg.agent { background: #16213e; }
.msg p { margin: 8px 0; }
.msg ul, .msg ol { padding-left: 24px; margin: 8px 0; }
.msg blockquote { border-left: 3px solid #e94560; padding-left: 12px; margin: 8px 0; color: #aaa; }
.msg table { border-collapse: collapse; margin: 8px 0; width: 100%; }
.msg th, .msg td { border: 1px solid #333; padding: 6px 12px; text-align: left; }
.msg th { background: #0f3460; }
.msg code { background: #2d2d44; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
.msg pre { background: #2d2d44; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
.msg pre code { background: none; padding: 0; }

/* Loading indicator */
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing span { width: 8px; height: 8px; background: #e94560; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.typing span:nth-child(1) { animation-delay: -0.32s; }
.typing span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

#input-bar { display: flex; padding: 16px 24px; background: #16213e; gap: 8px; }
#input { flex: 1; padding: 10px 16px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 14px; outline: none; }
#input:focus { border-color: #e94560; }
#send { padding: 10px 24px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
#send:hover { background: #c73652; }
#send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>LTMA Chat</h1>
  <span>connected</span>
</header>
<div id="chat">
  <div class="msg agent"><p>Hello! I'm LTMA. How can I help you?</p></div>
</div>
<div id="input-bar">
  <input id="input" placeholder="Type a message..." autofocus>
  <button id="send" onclick="send()">Send</button>
</div>

<script>
// Configure marked with highlight.js
marked.use(markedHighlight({
  langPrefix: 'hljs language-',
  highlight(code, lang) {
    try {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    } catch {}
    return hljs.highlightAuto(code).value;
  }
}));

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

let loadingMsg = null;

async function send() {
  const msg = inputEl.value.trim();
  if (!msg) return;
  inputEl.value = '';
  addMsg('user', msg);
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, agent: 'chat' })
    });
    const data = await res.json();
    hideTyping();
    addMsg('agent', data.response || data.error || '(no response)');
  } catch (err) {
    hideTyping();
    addMsg('agent', '**Error:** ' + err.message);
  }
}

function addMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = marked.parse(content);
  chatEl.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}

function showTyping() {
  sendBtn.disabled = true;
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping() {
  sendBtn.disabled = false;
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}
</script>
</body>
</html>
